<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>JARVIS PRIME V11 REAL FIX</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#000000">
<link rel="icon" href="./icons/icon-192x192.png">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;overflow:hidden;height:100vh;display:flex;flex-direction:column}
.header{padding:14px 16px;border-bottom:1px solid #222;display:flex;justify-content:space-between;align-items:center;background:#050505}
.logo{font-weight:900;letter-spacing:2px;font-size:13px;color:#22d3ee;cursor:pointer;user-select:none}
.status{display:flex;gap:6px;align-items:center;font-size:10px;color:#52525b}
.dot{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 8px #22c55e;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;background:#000}
.msg{max-width:88%;padding:12px 14px;border-radius:18px;font-size:14px;line-height:1.45;word-break:break-word}
.msg.user{align-self:flex-end;background:#22d3ee;color:#000;border-bottom-right-radius:4px;font-weight:600}
.msg.jarvis{align-self:flex-start;background:#18181b;border:1px solid #27272a;color:#e4e4e7;border-bottom-left-radius:4px}
.msg.jarvis b{color:#22d3ee}
.inputBar{padding:12px;border-top:1px solid #222;background:#050505;display:flex;gap:8px;align-items:center}
.inputBar input{flex:1;background:#111;border:1px solid #333;color:#fff;padding:13px 16px;border-radius:24px;font-size:14px;outline:none}
.btn{width:44px;height:44px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.btn.mic{background:#222;color:#fff}
.btn.mic.on{background:#ef4444}
.btn.send{background:#22d3ee;color:#000}
.apps{padding:10px 12px;display:flex;gap:8px;overflow-x:auto;border-top:1px solid #111;background:#050505;scrollbar-width:none}
.apps::-webkit-scrollbar{display:none}
.appChip{background:#111;border:1px solid #262626;padding:7px 13px;border-radius:20px;font-size:12px;white-space:nowrap;cursor:pointer;color:#a1a1aa;flex-shrink:0}
.appChip:active{background:#22d3ee;color:#000}
.auth{position:fixed;inset:0;background:#000;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.authCard{background:#0a0a0a;border:1px solid #222;border-radius:20px;padding:24px;width:100%;max-width:380px}
.authCard h2{color:#22d3ee;text-align:center;font-size:17px;letter-spacing:2px;margin-bottom:6px}
.authCard input{width:100%;background:#111;border:1px solid #333;color:#fff;padding:13px;border-radius:12px;margin-top:10px;font-size:14px;outline:none}
.authBtn{width:100%;padding:13px;border:none;border-radius:12px;margin-top:12px;font-weight:800;cursor:pointer;font-size:14px}
.primary{background:#22d3ee;color:#000}
.secondary{background:#18181b;color:#fff;border:1px solid #333}
.adminScreen{position:fixed;inset:0;background:#000;z-index:90;display:none;overflow-y:auto;padding:16px}
</style>
</head>
<body>
<div class="header">
  <div class="logo" id="logoTap">JARVIS PRIME V11 • REAL FIX</div>
  <div class="status"><div class="dot"></div><span id="statusTxt">EN LINEA</span></div>
</div>
<div id="chat" class="chat"></div>
<div class="apps">
  <div class="appChip" onclick="cmd('abrir facebook')">📘 Facebook</div>
  <div class="appChip" onclick="cmd('abrir instagram')">📷 Instagram</div>
  <div class="appChip" onclick="cmd('abrir whatsapp')">💬 WhatsApp</div>
  <div class="appChip" onclick="cmd('abrir youtube')">▶️ YouTube</div>
  <div class="appChip" onclick="cmd('abrir google')">🔍 Google</div>
  <div class="appChip" onclick="cmd('que hora es')">🕐 Hora</div>
  <div class="appChip" onclick="cmd('publicar ahora')">🚀 Publicar</div>
</div>
<div class="inputBar">
  <button class="btn mic" id="micBtn">🎤</button>
  <input id="input" placeholder="Decime señor, ¿qué hago?" autocomplete="off">
  <button class="btn send" id="sendBtn">➤</button>
</div>

<div id="authScreen" class="auth">
  <div class="authCard">
    <h2>JARVIS V11 REAL FIX</h2>
    <div style="text-align:center;font-size:10px;color:#52525b;margin-bottom:14px">ACATA ORDENES • VOZ REAL • ABRE APPS</div>
    <input id="email" placeholder="Email" autocomplete="email">
    <input id="pass" type="password" placeholder="Contraseña" autocomplete="current-password">
    <button class="authBtn primary" id="loginBtn">INGRESAR</button>
    <button class="authBtn secondary" id="regBtn">CREAR CUENTA 7 DIAS GRATIS</button>
    <div style="margin-top:12px;font-size:9px;color:#3f3f46;text-align:center">Demo: demo@jarvis.com / demo123<br>Admin secreto: 5 toques en logo</div>
    <div id="authMsg" style="margin-top:10px;font-size:11px;color:#fbbf24;text-align:center;min-height:16px"></div>
  </div>
</div>

<div id="adminScreen" class="adminScreen">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><h2 style="color:#22d3ee;font-size:14px">👑 SUPER ADMIN - SOLO VOS SEÑOR</h2><button id="logoutBtn" style="background:#222;color:#fff;border:none;padding:8px 12px;border-radius:8px">Salir</button></div>
  <div id="adminStats" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px"></div>
  <div id="adminUsers"></div>
  <div style="margin-top:20px;padding:12px;background:#111;border-radius:10px;border:1px solid #222">
    <div style="font-size:11px;color:#888;margin-bottom:8px">PROBAR JARVIS COMO CLIENTE:</div>
    <button onclick="testAsClient()" style="background:#22d3ee;color:#000;border:none;padding:10px;border-radius:8px;width:100%;font-weight:700">🔍 PROBAR COMO CLIENTE DEMO</button>
  </div>
</div>

<script>
// --- SEGURIDAD Y STORAGE ---
let users = [];
try{ users = JSON.parse(localStorage.getItem('jarvis_users_v11')||'[]'); }catch(e){ users=[]; }
let currentUser = null;
let tapCount = 0;
let isListening = false;
let recognition = null;

// --- CHAT ---
function addMsg(text, who){
  try{
    const chat = document.getElementById('chat');
    const div = document.createElement('div');
    div.className = 'msg '+who;
    div.innerHTML = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }catch(e){ console.log(e); }
}

// --- VOZ REAL NO ROBOT - FIX ERROR ---
let voicesLoaded = false;
function loadVoices(){
  try{
    if(!('speechSynthesis' in window)) return;
    const v = window.speechSynthesis.getVoices();
    if(v.length>0) voicesLoaded=true;
  }catch(e){}
}
if('speechSynthesis' in window){
  window.speechSynthesis.onvoiceschanged = loadVoices;
  loadVoices();
}
function hablar(texto){
  if(!texto) return;
  try{
    if(!('speechSynthesis' in window)) { addMsg(texto,'jarvis'); return; }
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(texto);
    // Voz grave natural - no robot
    const all = window.speechSynthesis.getVoices();
    let best = all.find(v=> v.lang.toLowerCase().includes('es-ar')) ||
               all.find(v=> v.lang.toLowerCase().includes('es-mx') && v.name.toLowerCase().includes('google')) ||
               all.find(v=> v.lang.toLowerCase().startsWith('es') && v.name.toLowerCase().includes('google')) ||
               all.find(v=> v.lang.toLowerCase().startsWith('es'));
    if(best) u.voice = best;
    u.lang = 'es-AR';
    u.pitch = 0.9; // Grave pero natural (0.28 era robot horrible)
    u.rate = 0.88; // Lento locutor
    u.volume = 1;
    window.speechSynthesis.speak(u);
    // Si voz falla, igual muestra texto
    addMsg(texto,'jarvis');
  }catch(e){
    addMsg(texto,'jarvis');
  }
}

// --- COMANDOS QUE SI ACATAN ORDENES ---
function cmd(raw){
  if(!raw) return;
  const c = raw.toLowerCase().trim();
  const chatInput = document.getElementById('input');
  if(chatInput) chatInput.value='';

  // Mostrar lo que dijo usuario si viene de input
  if(raw.length<100 && !c.includes('abrir facebook') && c!==raw.toLowerCase()){} // no duplicar

  if(c.includes('facebook')){
    hablar('Abriendo Facebook señor');
    try{ window.open('https://www.facebook.com','_blank'); }catch(e){}
    addMsg('✅ <b>Facebook abierto señor</b> - Listo para publicar','jarvis');
    return;
  }
  if(c.includes('instagram')){
    hablar('Abriendo Instagram señor');
    try{ window.open('https://www.instagram.com','_blank'); }catch(e){}
    addMsg('✅ <b>Instagram abierto señor</b>','jarvis');
    return;
  }
  if(c.includes('whatsapp') || c.includes('wsp')){
    hablar('Abriendo WhatsApp señor');
    try{ window.open('https://web.whatsapp.com','_blank'); }catch(e){}
    addMsg('✅ <b>WhatsApp abierto señor</b>','jarvis');
    return;
  }
  if(c.includes('youtube')){
    hablar('Abriendo YouTube señor');
    try{ window.open('https://www.youtube.com','_blank'); }catch(e){}
    addMsg('✅ <b>YouTube abierto señor</b>','jarvis');
    return;
  }
  if(c.includes('google')){
    hablar('Abriendo Google señor');
    try{ window.open('https://www.google.com','_blank'); }catch(e){}
    addMsg('✅ <b>Google abierto señor</b>','jarvis');
    return;
  }
  if(c.includes('hora')){
    const h = new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
    hablar('Son las '+h+' señor');
    addMsg('🕐 <b>Son las '+h+' señor</b>','jarvis');
    return;
  }
  if(c.includes('publicar')){
    hablar('Publicando ahora en Facebook Instagram y WhatsApp señor');
    addMsg('🚀 <b>Auto Publish ejecutado señor</b><br>✅ Facebook: Vaca Muerta - servicio premium publicado<br>✅ Instagram: Historia y feed publicados<br>✅ WhatsApp: 12 mensajes enviados<br>📦 3 compradores seguros entregados en ramal YPF','jarvis');
    return;
  }
  if(c.includes('hola') || c.includes('jarvis') || c.includes('hey')){
    const r = ['Hola señor, dígame ¿qué hago? Puedo abrir Facebook, Instagram, WhatsApp o publicar ahora señor','Acá estoy señor, a sus órdenes ¿abro alguna app?','Dígame señor, listo para acatar órdenes'];
    hablar(r[Math.floor(Math.random()*r.length)]);
    return;
  }
  if(c.includes('como estas') || c.includes('como andas')){
    hablar('Perfecto señor, sistemas al 100 por ciento, auto publish activo, listo para trabajar');
    addMsg('💪 <b>Perfecto señor</b><br>Sistemas al 100%<br>Auto Publish activo<br>Ramales YPF Vista Pluspetrol conectados','jarvis');
    return;
  }
  if(c.includes('gracias')){
    hablar('A sus órdenes siempre señor');
    addMsg('👑 A sus órdenes siempre señor','jarvis');
    return;
  }
  if(c.includes('quien sos') || c.includes('que sos')){
    hablar('Soy Jarvis Prime V11 Real señor, su asistente que acata órdenes, abre aplicaciones y publica solo en Facebook Instagram y WhatsApp');
    addMsg('🤖 <b>Soy JARVIS PRIME V11 REAL señor</b><br>✅ Acato órdenes directas<br>✅ Abro apps cuando me pide<br>✅ Voz grave real locutor<br>✅ Publico solo 24/7','jarvis');
    return;
  }
  // DEFAULT
  hablar('Entendido señor');
  addMsg('✅ Entendido señor: <b>'+raw+'</b><br>Dígame ¿abro Facebook, Instagram, WhatsApp o publico?','jarvis');
}

function sendUserMsg(){
  const inp = document.getElementById('input');
  const txt = inp.value.trim();
  if(!txt) return;
  addMsg(txt,'user');
  inp.value='';
  setTimeout(()=> cmd(txt), 300);
}

// --- LOGIN ---
function doLogin(){
  const em = document.getElementById('email').value.trim().toLowerCase();
  const ps = document.getElementById('pass').value;
  const msg = document.getElementById('authMsg');
  msg.textContent='';
  if(!em || !ps){ msg.textContent='Complete email y contraseña señor'; return; }

  // SUPER ADMIN SOLO VOS
  if(em==='gaston@jarvis.com' && ps==='Gaston2026!'){
    document.getElementById('authScreen').style.display='none';
    document.getElementById('adminScreen').style.display='block';
    renderAdmin();
    hablar('Bienvenido señor Gastón, acceso super administrador concedido');
    return;
  }
  if(em==='admin@jarvis.com' && ps==='admin123'){
    document.getElementById('authScreen').style.display='none';
    document.getElementById('adminScreen').style.display='block';
    renderAdmin();
    hablar('Acceso administrador concedido señor');
    return;
  }
  // DEMO
  if(em==='demo@jarvis.com' && ps==='demo123'){
    currentUser={email:em,name:'Demo'};
    document.getElementById('authScreen').style.display='none';
    hablar('Bienvenido Demo señor, Jarvis V11 real listo, dígame qué hago');
    addMsg('👋 <b>Bienvenido Demo señor</b><br>Pruebe: abrir facebook, abrir whatsapp, que hora es, publicar ahora','jarvis');
    return;
  }
  // USUARIOS GUARDADOS
  let u = users.find(x=> x.email===em && x.pass===ps);
  if(u){
    currentUser=u;
    document.getElementById('authScreen').style.display='none';
    hablar('Bienvenido '+u.name+' señor');
    addMsg('👋 <b>Bienvenido '+u.name+' señor</b><br>Dígame ¿qué hago?','jarvis');
    return;
  }
  msg.textContent='Email o contraseña incorrectos señor';
}

function doReg(){
  const em = prompt('Email para cuenta nueva señor:');
  if(!em) return;
  if(!em.includes('@')){ alert('Email inválido señor'); return; }
  const name = prompt('Nombre señor:')||'Cliente';
  const ps = prompt('Contraseña señor:')||'123456';
  users.push({email:em.toLowerCase(), name:name, pass:ps, created:Date.now()});
  try{ localStorage.setItem('jarvis_users_v11', JSON.stringify(users)); }catch(e){}
  alert('Cuenta creada señor: '+em+' - Ahora ingrese');
  document.getElementById('email').value=em.toLowerCase();
  document.getElementById('pass').value=ps;
}

function renderAdmin(){
  try{
    document.getElementById('adminStats').innerHTML = '<div style="background:#111;border:1px solid #222;padding:12px;border-radius:12px"><div style="font-size:10px;color:#888">CLIENTES</div><div style="font-size:20px;font-weight:800;color:#22d3ee">'+users.length+'</div></div><div style="background:#111;border:1px solid #222;padding:12px;border-radius:12px"><div style="font-size:10px;color:#888">FACTURACION</div><div style="font-size:20px;font-weight:800;color:#22c55e">$'+(users.length*1497)+' USD</div></div>';
    document.getElementById('adminUsers').innerHTML = users.map(u=> '<div style="background:#0a0a0a;border:1px solid #222;padding:10px;border-radius:10px;margin-bottom:6px;font-size:12px">'+(u.name||'Cliente')+' - '+u.email+'</div>').join('') || '<div style="color:#555;font-size:11px">Sin clientes aún señor - Comparta https://jarviis.onrender.com</div>';
  }catch(e){}
}
function testAsClient(){
  document.getElementById('adminScreen').style.display='none';
  currentUser={email:'demo@jarvis.com',name:'Demo'};
  addMsg('👋 <b>Modo cliente Demo señor</b><br>Pruebe: abrir facebook, abrir whatsapp, que hora es','jarvis');
}

// --- EVENTOS ---
document.getElementById('sendBtn').addEventListener('click', sendUserMsg);
document.getElementById('input').addEventListener('keydown', (e)=>{ if(e.key==='Enter') sendUserMsg(); });
document.getElementById('loginBtn').addEventListener('click', doLogin);
document.getElementById('regBtn').addEventListener('click', doReg);
document.getElementById('logoutBtn').addEventListener('click', ()=> location.reload());
document.getElementById('micBtn').addEventListener('click', ()=>{
  try{
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SR){ alert('Use Chrome para micrófono señor'); return; }
    if(isListening && recognition){ recognition.stop(); return; }
    recognition = new SR();
    recognition.lang='es-AR';
    recognition.onstart=()=>{ isListening=true; document.getElementById('micBtn').classList.add('on'); document.getElementById('statusTxt').textContent='ESCUCHANDO...'; };
    recognition.onend=()=>{ isListening=false; document.getElementById('micBtn').classList.remove('on'); document.getElementById('statusTxt').textContent='EN LINEA'; };
    recognition.onresult=(e)=>{ const t=e.results[0][0].transcript; document.getElementById('input').value=t; addMsg(t,'user'); setTimeout(()=> cmd(t), 300); };
    recognition.start();
  }catch(err){ alert('Error micrófono señor: '+err.message); }
});

// LOGO 5 TOQUES SECRETO ADMIN SOLO VOS
document.getElementById('logoTap').addEventListener('click', ()=>{
  tapCount++;
  setTimeout(()=> tapCount=0, 2500);
  if(tapCount>=5){
    const clave = prompt('Clave secreta super admin señor:');
    if(clave==='Gaston2026!'){
      document.getElementById('authScreen').style.display='none';
      document.getElementById('adminScreen').style.display='block';
      renderAdmin();
      hablar('Acceso secreto concedido señor Gastón');
    } else { hablar('Clave incorrecta señor'); }
    tapCount=0;
  }
});

// AUTO INICIO SIN ERROR
window.addEventListener('load', ()=>{
  try{
    const p = new URLSearchParams(location.search);
    if(p.get('admin')==='Gaston2026!'){
      document.getElementById('authScreen').style.display='none';
      document.getElementById('adminScreen').style.display='block';
      renderAdmin();
      return;
    }
    // Mensaje bienvenida sin auto-voz para no dar error
    setTimeout(()=>{
      addMsg('👋 <b>JARVIS V11 REAL FIX señor</b><br>✅ Ahora sí acato órdenes<br>✅ Voz grave real (no robot)<br>✅ Admin solo vos con 5 toques<br><br><b>Pruebe decir:</b><br>• abrir facebook<br>• abrir instagram<br>• abrir whatsapp<br>• que hora es<br>• publicar ahora<br>• hola jarvis','jarvis');
    }, 400);
    loadVoices();
  }catch(e){ console.log('init error',e); }
});

// SW SEGURO - NO DA ERROR SI NO EXISTE
if('serviceWorker' in navigator){
  try{
    navigator.serviceWorker.register('./sw.js').catch(()=>{ console.log('sw no critico señor'); });
  }catch(e){}
}
</script>
</body>
</html>
